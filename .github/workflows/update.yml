name: Update Dropbox Script

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 1'

# Deny all GITHUB_TOKEN permissions unless a job explicitly needs them.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update Dropbox Script
    runs-on: ubuntu-latest

    permissions:
      contents: write # Push the automated update branch.
      pull-requests: write # Create or update the automated pull request.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run updater
        run: ./scripts/update.sh

      - name: Detect changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain -- dropbox.py metadata.json headers.txt)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(./scripts/extract-version.sh dropbox.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate diff summary
        if: steps.changes.outputs.changed == 'true'
        id: diff
        run: |
          ./scripts/diff-summary.sh > diff-summary.txt

          CONTENT=$(head -150 diff-summary.txt)
          DELIM="DIFF_CONTENT_$(openssl rand -hex 8)"

          {
            echo "content<<$DELIM"
            echo "$CONTENT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Commit, push, and create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIFF_CONTENT: ${{ steps.diff.outputs.content }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          BRANCH="update-dropbox-$VERSION"
          TITLE="Update dropbox.py to $VERSION"

          # checkout uses persist-credentials: false, so configure temporary
          # Git authentication through GitHub CLI for this step.
          gh auth setup-git --force --hostname github.com

          # Remember the existing remote branch state so an update cannot
          # accidentally overwrite somebody else's concurrent change.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin \
              "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_SHA=$(git rev-parse "refs/remotes/origin/$BRANCH")
          else
            REMOTE_SHA=""
          fi

          git switch -C "$BRANCH"

          git add -- \
            dropbox.py \
            metadata.json \
            headers.txt

          git commit -m "$TITLE"

          if [[ -n "$REMOTE_SHA" ]]; then
            git push \
              --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin \
              "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          {
            echo "Automated upstream update detected."
            echo
            echo "## Version"
            echo
            printf "\`%s\`\n" "$VERSION"
            echo
            echo "## Metadata"
            echo
            printf "See updated \`metadata.json\`.\n"
            echo
            echo "## Diff Summary"
            echo
            printf "\`\`\`diff\n"
            printf '%s\n' "$DIFF_CONTENT"
            printf "\`\`\`\n"
            echo
            echo "Review the generated diff before merge."
          } > pr-body.md

          PR_NUMBER=$(
            gh pr list \
              --state open \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body-file pr-body.md \
              --add-label upstream-update \
              --add-label automated-pr
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file pr-body.md \
              --label upstream-update \
              --label automated-pr
          fi
