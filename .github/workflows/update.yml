name: Update Dropbox Script

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run updater
        run: ./scripts/update.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(./scripts/extract-version.sh dropbox.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate diff summary
        if: steps.changes.outputs.changed == 'true'
        id: diff
        run: |
          ./scripts/diff-summary.sh > diff-summary.txt || true
          CONTENT=$(head -150 diff-summary.txt)
          {
            echo "content<<EOF"
            echo "$CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-dropbox-${{ steps.version.outputs.version }}
          title: "Update dropbox.py to ${{ steps.version.outputs.version }}"
          commit-message: "Update upstream dropbox.py to ${{ steps.version.outputs.version }}"
          add-paths: |
            dropbox.py
            metadata.json
            headers.txt
          body: |
            Automated upstream update detected.

            ## Version

            `${{ steps.version.outputs.version }}`

            ## Metadata

            See updated `metadata.json`.

            ## Diff Summary

            ```diff
            ${{ steps.diff.outputs.content }}
            ```

            Review the generated diff before merge.
          labels: |
            upstream-update
            automated-pr

      - name: Push tag
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.pull-request-number != ''
        run: |
          git tag v${{ steps.version.outputs.version }} || true
          git push origin v${{ steps.version.outputs.version }} || true
